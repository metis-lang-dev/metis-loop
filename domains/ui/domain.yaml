# ui — the loop console page over the lifted voice-navigation base (console-nav
# s-b923ebfe): ui_domain.llp holds every rule; ui.llp adds the page's facts. The
# navigation agent moves the focus; the page is the host (effects out; every focus the
# person makes — mouse or keyboard — back through the input port). The program is a
# stage pipeline (clear sync local global post), so the watch reads once per pass.
program: ui.llp
host: ui_host.py:make
intent: {spec: intent.yaml}
clock: {beats: 1, lockstep: true}
display: the loop console's widgets and the person's focus
line: "ui — voice navigation over the page's widget tree; the lifted base ui_domain.llp, the console's facts ui.llp"
# the page's moves: a result is spoken as the fired rule's %% line, never re-voiced by the model
# (metis-agent: console-nav step 2 F4)
voice: line
