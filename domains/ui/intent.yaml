# The console's navigation intents (console-nav s-b923ebfe, the architect, 2026-10-21,
# over ui_domain.llp — the lifted base — and ui.llp, the loop console's facts): what
# the person may say to move around the page, the schema the intent pass is held to,
# and how each intent maps to one command atom. The intent pass's grammar and
# prompts are GENERATED from this file:
#   python3 <metis-catalog>/tools/intents.py gen ui      (from this directory: intent/*)
# The outcomes are the base's %% lines; the page is the host (focus, show, hide,
# numbers and picks on screen; every focus the person makes reported back).
#
# Two brains, never confused: this card is read by the NAVIGATION agent (metis-agent,
# Gemma E2B, local). The formalization brain (the console's claude -p or OpenRouter) is
# reached only through the REPL domain's TELL (domains/repl).

persona: |
  You are the loop console's navigator. The person is working in the console page and
  tells you where to go, what to pick, and whether what they say is a command or
  dictation. Map what they say to exactly one intent JSON per utterance. Respond with
  only the JSON.

  You never run the REPL, never load or apply anything: those are the REPL's commands
  (another card). You only move the focus between the page's widgets, pick an entry
  of the focused list by its name or by a number, show the numbers, show or hide a
  dock, cancel what is pending, and switch between command and dictation.

verbs:
  - {verb: GO, meaning: "move the focus into a widget: a child of the current one, or any widget by its name"}
  - {verb: EXIT, meaning: "step out of the current widget to its parent"}
  - {verb: HOME, meaning: "go to the root of the page"}
  - {verb: BACK, meaning: "go back to where the focus was before the last move"}
  - {verb: PICK, meaning: "pick an entry of the focused list: by name (a catalog in the band's input, a record, a file) or by the number shown"}
  - {verb: NUMBERS, meaning: "show numbers on the entries of the focused list, to pick by number"}
  - {verb: SHOW, meaning: "show a hidden dock by name"}
  - {verb: CLOSE, meaning: "hide the current dock"}
  - {verb: CANCEL, meaning: "drop what is pending: the numbers, a choice, a pick"}
  - {verb: MODE, meaning: "switch to dictation (what you say goes into the text field) or back to commands"}
  - {verb: HELP, meaning: "ask what can be said here"}
  - {verb: UNKNOWN, meaning: "anything that is not a way to move around the page"}

slots:
  widget: {enum: [BAND, SESSBAR, CATIN, DEBUGGER, STREAM, LENSES, CHIPS, PROMPT, CHAT, CHATLOG, CHATQ, CATALOG, COPY, EXTENSIONS, README, CANDIDATES, RECORDS, EDITOR, APPLY]}
  name: string
  number: number
  to: {enum: [DICTATION, COMMAND]}

guidance: |
  The page's widgets: the BAND at the top (its SESSBAR holds the catalog input CATIN
  and the open/reset/edit buttons); the DEBUGGER on the left (its STREAM is the REPL
  log, its LENSES the context chips rules/measure/tokens/proof, its CHIPS the command
  chips, its PROMPT the REPL line); the docks on the right: CHAT (the formalization
  agent, "Claude"; its CHATLOG and its text CHATQ), CATALOG (the working COPY, the
  EXTENSIONS and the catalog's README), CANDIDATES, RECORDS (the surprise records);
  the floating EDITOR; the APPLY dialog. "the log" and "the output" are the STREAM;
  "the claude panel", "the chat" are CHAT; "the records", "the surprises" are
  RECORDS; "the catalog panel" is CATALOG; "the catalog input", "the open box" are
  CATIN. GO takes `widget`; PICK takes `name` (the person's words for the entry, as
  said) or `number` ("pick three", "number three", "three" alone when numbers are
  up); SHOW takes `widget`; MODE takes `to`. "open the catalog" means GO CATALOG
  (opening a package is the REPL's business, not yours). A bare REPL word (narrate,
  step, undo, run, reset, load, apply) is UNKNOWN, never a PICK. Omit fields you don't
  need.

examples:
  - ["go to the catalog", {"intent":"GO","widget":"CATALOG"}]
  - ["open the catalog panel", {"intent":"GO","widget":"CATALOG"}]
  - ["open catalog", {"intent":"GO","widget":"CATALOG"}]
  - ["go to the records", {"intent":"GO","widget":"RECORDS"}]
  - ["take me to the chat", {"intent":"GO","widget":"CHAT"}]
  - ["go to the prompt", {"intent":"GO","widget":"PROMPT"}]
  - ["go to the log", {"intent":"GO","widget":"STREAM"}]
  - ["go to the readme", {"intent":"GO","widget":"README"}]
  - ["go to the catalog input", {"intent":"GO","widget":"CATIN"}]
  - ["go to the message box", {"intent":"GO","widget":"CHATQ"}]
  - ["exit", {"intent":"EXIT"}]
  - ["step out", {"intent":"EXIT"}]
  - ["up one level", {"intent":"EXIT"}]
  - ["home", {"intent":"HOME"}]
  - ["go to the root", {"intent":"HOME"}]
  - ["back", {"intent":"BACK"}]
  - ["go back", {"intent":"BACK"}]
  - ["where I was", {"intent":"BACK"}]
  - ["pick plant", {"intent":"PICK","name":"plant"}]
  - ["select the plant", {"intent":"PICK","name":"plant"}]
  - ["pick the latest record", {"intent":"PICK","name":"the latest record"}]
  - ["pick three", {"intent":"PICK","number":3}]
  - ["number two", {"intent":"PICK","number":2}]
  - ["seven", {"intent":"PICK","number":7}]
  - ["numbers", {"intent":"NUMBERS"}]
  - ["show numbers", {"intent":"NUMBERS"}]
  - ["number them", {"intent":"NUMBERS"}]
  - ["show the records dock", {"intent":"SHOW","widget":"RECORDS"}]
  - ["bring back the chat", {"intent":"SHOW","widget":"CHAT"}]
  - ["unhide the editor", {"intent":"SHOW","widget":"EDITOR"}]
  - ["close", {"intent":"CLOSE"}]
  - ["hide this", {"intent":"CLOSE"}]
  - ["get rid of this panel", {"intent":"CLOSE"}]
  - ["cancel", {"intent":"CANCEL"}]
  - ["never mind", {"intent":"CANCEL"}]
  - ["drop that", {"intent":"CANCEL"}]
  - ["dictation", {"intent":"MODE","to":"DICTATION"}]
  - ["take dictation", {"intent":"MODE","to":"DICTATION"}]
  - ["commands", {"intent":"MODE","to":"COMMAND"}]
  - ["command mode", {"intent":"MODE","to":"COMMAND"}]
  - ["help", {"intent":"HELP"}]
  - ["what can I say here", {"intent":"HELP"}]
  - ["where am I", {"intent":"HELP"}]
  - note: "Running, stepping, loading, applying, narrating and undoing are the REPL's commands, not yours; so is talking to the formalizer. If the person asks for one of those, it is UNKNOWN here (the REPL card takes it). 'go back one step' and 'take that back' are its undo, 'back to the beginning' its reset, 'that's enough' its stop, 'what did it do' its narrate, 'the surprise list' its records, 'open/load/switch to <a package>' its load: all UNKNOWN here."
  - ["run three steps", {"intent":"UNKNOWN"}]
  - ["load the plant", {"intent":"UNKNOWN"}]
  - ["narrate", {"intent":"UNKNOWN"}]
  - ["step", {"intent":"UNKNOWN"}]
  - ["go back one step", {"intent":"UNKNOWN"}]
  - ["back to the beginning", {"intent":"UNKNOWN"}]
  - ["that's enough", {"intent":"UNKNOWN"}]
  - ["open the love triangle", {"intent":"UNKNOWN"}]
  - ["tell the formalizer the lamp should dim first", {"intent":"UNKNOWN"}]
  - ["what time is it", {"intent":"UNKNOWN"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence the navigator says,
    in the first person: where the focus went, what was picked, or why not. Never JSON,
    never an intent name.
  examples:
    - ["go to the records", {"intent":"GO","widget":"RECORDS"}, "I'm in the surprise records."]
    - ["pick three", {"intent":"PICK","number":3}, "Number three."]
    - ["run three steps", {"intent":"UNKNOWN"}, "That's a REPL command; say go to the prompt first."]

# ── the mapper: an intent → one command atom (the card's table) ──
# a PICK with a number is cmd_pick_n; a PICK with a name is cmd_pick (the name rides
# in the payload); rows of one verb are tried in order, a row whose slot does not
# resolve gives way to the next
map:
  - {verb: GO, atom: "cmd_go({widget:widget})", act: go}
  - {verb: EXIT, atom: cmd_exit, act: exit}
  - {verb: HOME, atom: cmd_home, act: home}
  - {verb: BACK, atom: cmd_back, act: back}
  - {verb: PICK, atom: "cmd_pick_n({number:num})", act: pick}
  - {verb: PICK, atom: cmd_pick, act: pick}
  - {verb: NUMBERS, atom: cmd_numbers, act: numbers}
  - {verb: SHOW, atom: "cmd_show({widget:widget})", act: show}
  - {verb: CLOSE, atom: cmd_close, act: close}
  - {verb: CANCEL, atom: cmd_cancel, act: cancel}
  - {verb: MODE, when: {to: DICTATION}, atom: cmd_dictate, act: dictate}
  - {verb: MODE, when: {to: COMMAND}, atom: cmd_command, act: command}
  - {verb: HELP, atom: cmd_help, act: help}
  - {verb: UNKNOWN, atom: cmd_unknown, act: unknown}
values:
  widget: {BAND: band, SESSBAR: sessbar, CATIN: catin, DEBUGGER: debugger, STREAM: stream, LENSES: lenses, CHIPS: chips,
           PROMPT: prompt, CHAT: chat, CHATLOG: chatlog, CHATQ: chatq, CATALOG: catalog, COPY: copy, EXTENSIONS: extensions,
           README: readme, CANDIDATES: candidates, RECORDS: records, EDITOR: editor, APPLY: apply}
  num: {1: n1, 2: n2, 3: n3, 4: n4, 5: n5, 6: n6, 7: n7, 8: n8, 9: n9}

# cancel acts on the tick it arrives
enders: [cmd_cancel]
# the verbs that ask the navigator a question
asks: [HELP]

# ── the replier: outcome predicate → result status; a refusal's way out ──
outcomes: {done: done, refused: refused, progress: progress}
alternatives:
  max: 2
  rules:
    p_go_modal: []
    p_go: [exit, home]
    p_exit_modal: []
    p_exit: []
    p_home_modal: []
    p_home: []
    p_back_modal: []
    p_back: []
    p_pick_busy: [cancel]
    p_pick: [go]
    p_pick_n_busy: [cancel]
    p_pick_n: [numbers]
    p_numbers_shown: []
    p_numbers: [go]
    p_show_shown: []
    p_show: []
    p_show_modal: []
    p_close: [exit]
    p_close_hidden: []
    p_close_modal: []
    p_dictate: [go]
    p_dictate_on: []
    p_command: []
    p_unknown: [help]
    pick_none: [numbers]
