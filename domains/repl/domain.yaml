# repl — the loop console's REPL as a domain (console-nav s-b923ebfe): the navigation
# agent types the person's words into commands; the host is a websocket client of the
# loop gateway (the frames the page sends out, the gateway's answers back as reports).
program: repl.llp
host: repl_host.py:make
intent: {spec: intent.yaml}
clock: {beats: 1}
display: the loop console's REPL — load, run, step, undo, reset, narrate, records, apply, stop, tell
line: "repl — the console's REPL commands under the session's state; apply only shows the plan; tell hands over to the formalizer"
# the REPL's tasks: a result is spoken as the fired rule's %% line, never re-voiced by the model
# (metis-agent: console-nav step 2 F4)
voice: line
