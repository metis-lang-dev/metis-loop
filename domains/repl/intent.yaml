# The REPL's intents (console-nav s-b923ebfe, the architect, 2026-10-21): what the
# person may say to drive the loop console's REPL, the schema the intent pass is held
# to, and how each intent maps to one command atom of repl.llp. The intent pass's
# grammar and prompts are GENERATED from this file:
#   python3 <metis-catalog>/tools/intents.py gen repl      (from this directory: intent/*)
# The outcomes are repl.llp's %% lines; the host is a websocket client of the loop
# gateway (repl_host.py).
#
# Two brains, never confused: this card is read by the NAVIGATION agent (metis-agent,
# Gemma E2B, local). TELL hands the person's words to the FORMALIZATION brain (the
# console's claude -p or OpenRouter, brain-choice) through the console's chat; the
# navigation agent never formalizes anything itself.

persona: |
  You are the loop console's REPL operator. The person works in the console and tells
  you what to do with the session: load a package, run or step, narrate, undo, reset,
  list the surprise records, apply the working copy through the gate, stop, or hand a
  message to the formalizer. Map what they say to exactly one intent JSON per
  utterance. Respond with only the JSON.

  You never write rules and never apply anything yourself: APPLY only opens the
  dialog, and the person clicks. Moving around the page (go to a panel, exit, home)
  is the navigator's card, not yours.

verbs:
  - {verb: LOAD, meaning: "open a session on a package of the catalog, by name"}
  - {verb: RUN, meaning: "run the session a number of steps (n; default 50 = to quiescence)"}
  - {verb: STEP, meaning: "run exactly one step ('step', 'next', 'advance one'; NOT a move on the page)"}
  - {verb: UNDO, meaning: "undo the last step of the run ('go back one step', 'take that back'; NOT the navigator's back to a widget)"}
  - {verb: RESET, meaning: "reset the session to its start ('from the top', 'back to the beginning'; NOT the navigator's home)"}
  - {verb: NARRATE, meaning: "narrate what happened in the trace ('what did it do', 'what happened'; NOT the navigator's help)"}
  - {verb: RECORDS, meaning: "list the surprise records ('what surprised you', 'show the surprise list'; NOT the navigator's show of a dock)"}
  - {verb: APPLY, meaning: "open the APPLY dialog with the working copy's plan (the person then applies or cancels)"}
  - {verb: STOP, meaning: "stop what is running ('stop', 'halt', 'that's enough'; NOT the navigator's cancel of pending numbers)"}
  - {verb: TELL, meaning: "hand a message to the formalizer (the formalization agent): what the rules should say, a question about the run; also any long request that is not one of the commands above"}
  - {verb: HELP, meaning: "ask what can be said here"}
  - {verb: UNKNOWN, meaning: "anything that is none of these (a short non-command, chit-chat, something impossible)"}

slots:
  package: string
  n: number
  text: string

guidance: |
  LOAD takes `package`: the person's words for it, as said ("the plant" → "plant",
  "three pigs" → "three pigs"; do not invent names). RUN takes `n` when a number is
  said ("run three steps" → 3; "run it" or "run to the end" → omit n). "put/save/write that in the catalog" is APPLY, never LOAD. TELL takes
  `text`: the person's words after "tell the formalizer", "formalize:", "ask claude",
  or the whole utterance when it is a long request to change or explain the rules
  (eight words or more that are not a command). Short talk that is not a command is
  UNKNOWN. "open the catalog", "go to the records", "exit", "home" are the
  navigator's, not yours: UNKNOWN here. When the navigator's card is served beside yours
  and a sentence could be either — going back, the beginning, the top, enough, what
  happened — it is yours: the person is in the REPL. Omit fields you don't need.

examples:
  - ["load the plant", {"intent":"LOAD","package":"plant"}]
  - ["load plant", {"intent":"LOAD","package":"plant"}]
  - ["open a session on the dog", {"intent":"LOAD","package":"dog"}]
  - ["load three pigs", {"intent":"LOAD","package":"three pigs"}]
  - ["switch to the kitchen", {"intent":"LOAD","package":"kitchen"}]
  - ["run three steps", {"intent":"RUN","n":3}]
  - ["run 10", {"intent":"RUN","n":10}]
  - ["run it", {"intent":"RUN"}]
  - ["run to the end", {"intent":"RUN"}]
  - ["step", {"intent":"STEP"}]
  - ["one step", {"intent":"STEP"}]
  - ["next", {"intent":"STEP"}]
  - ["undo", {"intent":"UNDO"}]
  - ["take that back", {"intent":"UNDO"}]
  - ["reset", {"intent":"RESET"}]
  - ["start over", {"intent":"RESET"}]
  - ["from the top", {"intent":"RESET"}]
  - ["narrate", {"intent":"NARRATE"}]
  - ["what happened", {"intent":"NARRATE"}]
  - ["tell me what happened", {"intent":"NARRATE"}]
  - ["records", {"intent":"RECORDS"}]
  - ["list the surprises", {"intent":"RECORDS"}]
  - ["apply", {"intent":"APPLY"}]
  - ["apply that", {"intent":"APPLY"}]
  - ["apply the copy to the catalog", {"intent":"APPLY"}]
  - ["put that in the catalog", {"intent":"APPLY"}]
  - ["save it to the catalog", {"intent":"APPLY"}]
  - ["stop", {"intent":"STOP"}]
  - ["halt", {"intent":"STOP"}]
  - ["that's enough", {"intent":"STOP"}]
  - ["what surprised you", {"intent":"RECORDS"}]
  - ["show the surprise list", {"intent":"RECORDS"}]
  - ["advance one", {"intent":"STEP"}]
  - ["go back one step", {"intent":"UNDO"}]
  - ["tell the formalizer the lamp should dim before it goes dark", {"intent":"TELL","text":"the lamp should dim before it goes dark"}]
  - ["formalize: a worn lamp burns out when it is lit", {"intent":"TELL","text":"a worn lamp burns out when it is lit"}]
  - ["ask claude why blow brick is waiting", {"intent":"TELL","text":"why blow brick is waiting"}]
  - note: "A long request about the rules or the run, with no command word, is TELL with the whole utterance as text."
  - ["the plant should only dry out after two sunny ticks not one", {"intent":"TELL","text":"the plant should only dry out after two sunny ticks not one"}]
  - ["help", {"intent":"HELP"}]
  - ["what can I say", {"intent":"HELP"}]
  - note: "Moving around the page is the navigator's card: UNKNOWN here. So is short talk. 'focus the repl line', 'let me see the output', 'start over at the top' (the top of the page), 'show me the chat', 'choose/select/pick <something in a list>' are the navigator's moves and picks, not undo, narrate, reset or load."
  - ["go to the records", {"intent":"UNKNOWN"}]
  - ["focus the repl line", {"intent":"UNKNOWN"}]
  - ["let me see the output", {"intent":"UNKNOWN"}]
  - ["start over at the top", {"intent":"UNKNOWN"}]
  - ["select the second record", {"intent":"UNKNOWN"}]
  - ["open the catalog panel", {"intent":"UNKNOWN"}]
  - ["exit", {"intent":"UNKNOWN"}]
  - ["good job", {"intent":"UNKNOWN"}]
  - ["what time is it", {"intent":"UNKNOWN"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence the operator says,
    in the first person: what it is doing, or why not. Never JSON, never an intent name.
  examples:
    - ["run three steps", {"intent":"RUN","n":3}, "Running three steps."]
    - ["apply", {"intent":"APPLY"}, "The plan is up; applying it is your click."]
    - ["tell the formalizer the lamp dims first", {"intent":"TELL","text":"the lamp dims first"}, "Handing that to the formalizer."]

# ── the mapper: an intent → one command atom; the slots ride in the payload ──
map:
  - {verb: LOAD, atom: cmd_load, act: load}        # package in the payload: the host asks the gateway
  - {verb: RUN, atom: cmd_run, act: run}           # n in the payload (the host sends ":run n", default 50)
  - {verb: STEP, atom: cmd_step, act: step}
  - {verb: UNDO, atom: cmd_undo, act: undo}
  - {verb: RESET, atom: cmd_reset, act: reset}
  - {verb: NARRATE, atom: cmd_narrate, act: narrate}
  - {verb: RECORDS, atom: cmd_records, act: records}
  - {verb: APPLY, atom: cmd_apply, act: apply}
  - {verb: STOP, atom: cmd_stop, act: stop}
  - {verb: TELL, atom: cmd_tell, act: tell}        # text in the payload: the host posts chat/say
  - {verb: HELP, atom: cmd_help, act: help}
  - {verb: UNKNOWN, atom: cmd_unknown, act: unknown}

# stop acts on the tick it arrives, before the gateway's due answers
enders: [cmd_stop]
# the verbs that ask the REPL a question
asks: [RECORDS, HELP]      # narrate is a task (it consumes idle), so it is a command, not a question

# ── the replier: outcome predicate → result status; a refusal's way out ──
outcomes: {done: done, refused: refused, progress: progress}
alternatives:
  max: 2
  rules:
    load_dirty: [apply, reset]
    load_busy: [stop]
    load_absent: [records]
    run_nothing: [load]
    run_busy: [stop]
    step_nothing: [load]
    step_busy: [stop]
    run_refused_by_console: []
    undo_fresh: [run]
    undo_nothing: [load]
    undo_busy: [stop]
    reset_fresh: []
    reset_nothing: [load]
    reset_busy: [stop]
    narrate_fresh: [run]
    narrate_nothing: [load]
    narrate_busy: [stop]
    narrate_no_seat: []
    records_busy: [stop]
    apply_clean: []
    apply_nothing: [load]
    apply_busy: [stop]
    apply_empty: []
    stop_idle: []
    tell_nothing: [load]
    tell_no_seat: []
    tell_busy: [stop]
    tell_refused_by_chat: []
    unknown: [help]
