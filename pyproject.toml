[project]
name = "metis-loop"
version = "0.1.0"
description = "The metis formalization/explanation loop: surprise records -> text -> gated candidate packs (deployment shape deferred; library + CLI)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# `metis-loop console-serve` (docs/CONSOLE-WS.md): the gateway
# (+ the catalog's loader: pip install -e ../metis-catalog, a sibling checkout,
# not on PyPI — pyyaml here so the loader's path fallback works without it)
console = ["websockets>=13", "pyyaml>=6"]
# the console's agent seat (personal mode, CONSOLE-WS §3)
agent = ["websockets>=13", "claude-agent-sdk"]

[project.scripts]
metis-loop = "loop.cli:main"

[tool.setuptools.packages.find]
include = ["loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
