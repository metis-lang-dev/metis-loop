[build-system]
requires = ["setuptools>=77"]      # PEP 639: license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "metis-loop"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "The metis formalization/explanation loop: surprise records -> text -> gated candidate extensions (deployment shape deferred; library + CLI)"
requires-python = ">=3.9"
# the loop SDK (sdk/, metis-loop-sdk): the human loop consumes it as any
# outside consumer would — pip install -e ./sdk first (run.sh, CI)
dependencies = ["metis-loop-sdk"]

[project.optional-dependencies]
# `metis-loop` (docs/CONSOLE-WS.md): the gateway, over the catalog in the cwd
# (+ the catalog's loader: pip install metis-catalog, or -e a checkout)
console = ["websockets>=13", "pyyaml>=6"]
# the console's agent seat (personal mode, CONSOLE-WS §3)
agent = ["websockets>=13", "metis-loop-sdk[claude]"]

[project.scripts]
metis-loop = "loop.cli:main"

[tool.setuptools.packages.find]
include = ["loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
