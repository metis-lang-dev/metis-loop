<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nina — harness</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full bg-slate-950 text-slate-200 font-sans antialiased">
  <div class="mx-auto max-w-6xl p-3 md:p-4 flex flex-col gap-3 h-full">

    <!-- header: link state · dialog-state strip · attention · mic · audio -->
    <header class="flex flex-wrap items-center gap-3 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2">
      <div class="flex items-center gap-2 min-w-[9rem]">
        <span id="linkDot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-600" title="/ws link"></span>
        <span class="text-sm font-bold tracking-wide text-cyan-300">nina</span>
        <span id="linkLbl" class="text-[11px] font-mono text-slate-500">connecting…</span>
      </div>

      <div id="dialogStrip" class="flex items-stretch rounded-lg overflow-hidden border border-slate-700 text-[11px] font-mono" title="dialog state (from the engine)">
        <span data-st="ASLEEP"    class="px-2.5 py-1 bg-slate-800 text-slate-500">ASLEEP</span>
        <span data-st="AWAKE"     class="px-2.5 py-1 bg-slate-800 text-slate-500 border-l border-slate-700">AWAKE</span>
        <span data-st="LISTENING" class="px-2.5 py-1 bg-slate-800 text-slate-500 border-l border-slate-700">LISTENING</span>
        <span data-st="SPEAKING"  class="px-2.5 py-1 bg-slate-800 text-slate-500 border-l border-slate-700">SPEAKING</span>
      </div>

      <label class="flex items-center gap-2 text-[11px] font-mono cursor-pointer select-none" title="attention{AWAKE|ASLEEP} — the UI switch">
        <input id="attnSwitch" type="checkbox" class="accent-emerald-400 w-4 h-4" />
        <span id="attnLbl" class="text-slate-400">attention</span>
      </label>

      <div class="ml-auto flex items-center gap-2">
        <button id="btnAudio" class="px-2.5 py-1 rounded-md text-[11px] font-mono border border-amber-500/60 text-amber-300 hover:bg-amber-500/10" title="Chrome needs a click before it plays audio">enable audio</button>
        <button id="btnMic" class="px-2.5 py-1 rounded-md text-[11px] font-mono border border-slate-600 text-slate-300 hover:bg-slate-800" title="grab the mic token and stream 20 ms frames to /ws_mic">mic off</button>
        <span id="micDot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-700" title="mic stream"></span>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-5 gap-3 flex-1 min-h-0">

      <!-- chat: transcript (you) + reply (nina) + intent summary (dim) -->
      <section class="md:col-span-3 flex flex-col bg-slate-900 border border-slate-800 rounded-xl p-3 min-h-[20rem]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold text-cyan-300 uppercase tracking-wide">chat</span>
          <span class="text-[10px] font-mono text-slate-500">you = transcript · nina = reply (what was spoken)</span>
        </div>
        <div id="chatCard" class="flex-1 overflow-y-auto font-mono text-[12px] space-y-0.5 leading-snug pr-1">
          <div class="text-slate-500 italic">…no conversation yet…</div>
        </div>
        <form id="chatForm" class="mt-2 flex gap-2">
          <input id="chatInput" type="text" autocomplete="off" placeholder="type an utterance — say_text{text}"
                 class="flex-1 bg-slate-950 border border-slate-700 rounded-md px-2.5 py-1.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-cyan-500" />
          <button class="px-3 py-1.5 rounded-md text-sm bg-cyan-600 hover:bg-cyan-500 text-white">send</button>
        </form>
      </section>

      <!-- events: commands the robot would have executed, with task injection -->
      <section class="md:col-span-2 flex flex-col bg-slate-900 border border-slate-800 rounded-xl p-3 min-h-[20rem]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold text-fuchsia-300 uppercase tracking-wide">events · commands</span>
          <span class="text-[10px] font-mono text-slate-500">answer with task{id,result,detail}</span>
        </div>
        <div id="eventsCard" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <div class="text-slate-500 italic text-[12px] font-mono">…no commands yet…</div>
        </div>
        <div class="mt-2 flex items-center gap-2">
          <input id="taskDetail" type="text" placeholder="detail for the next injected task (optional)"
                 class="flex-1 bg-slate-950 border border-slate-700 rounded-md px-2 py-1 text-[11px] font-mono text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-fuchsia-500" />
        </div>
      </section>

      <!-- raw log -->
      <section class="md:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">wire log</span>
          <div class="flex items-center gap-3 text-[10px] font-mono text-slate-500">
            <span id="ttsLbl">tts —</span>
            <button id="btnAnnounce" class="underline hover:text-slate-300" title="say{text}: an external announcement (spoken on a free floor, awake, fresh)">announce test</button>
            <button id="btnClear" class="underline hover:text-slate-300">clear</button>
          </div>
        </div>
        <div id="logCard" class="h-40 overflow-y-auto font-mono text-[10px] leading-tight text-slate-400 space-y-px"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
