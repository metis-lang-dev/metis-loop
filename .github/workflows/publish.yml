name: publish

# metis-loop-sdk (sdk/) to PyPI by trusted publishing (pi-release s-8e13f6a8;
# metispy's flow): the PyPI project's pending publisher is owner
# metis-lang-dev, repo metis-loop, this workflow (publish.yml), environment
# `pypi` (no required reviewer: the tag is the release). No secret, no token:
# the upload authenticates with the job's OIDC identity. The human loop
# (metis-loop itself) is not published.
#
#   a push of a tag sdk-vX.Y.Z   build sdk/, check the tag against its pyproject's
#                                version, smoke-install the wheel with metispy from
#                                PyPI and metis-catalog from its public checkout
#                                (it is not on PyPI), then upload: a tag
#                                publishes straight through
#                                (`gh release create sdk-vX.Y.Z` pushes it)
#   workflow_dispatch            the dry run: build, check, smoke; no upload. The
#                                smoke's metis-catalog is the public checkout
#                                (catalog: checkout, the default) or PyPI's
#
# A release (sdk/README.md "Releasing"): bump `version` in sdk/pyproject.toml
# and metis_loop_sdk.__version__, commit, `gh release create sdk-vX.Y.Z`;
# metispy at the version it needs is on PyPI first; metis-catalog is the public checkout.

on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      catalog:
        description: "the smoke's metis-catalog: the public checkout, or PyPI's"
        type: choice
        options: [checkout, pypi]
        default: checkout

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      - name: Checkout metis-catalog (public sibling; the smoke's catalog until metis-catalog is on PyPI)
        if: github.event_name != 'workflow_dispatch' || inputs.catalog == 'checkout'
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag is sdk/pyproject's version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('metis-loop/sdk/pyproject.toml', 'rb'))['project']['version'])")
          m=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' metis-loop/sdk/metis_loop_sdk/__init__.py)
          echo "sdk/pyproject version: $v, metis_loop_sdk.__version__: $m"
          [ "$m" = "$v" ] || { echo "::error::metis_loop_sdk.__version__ $m is not sdk/pyproject.toml's $v"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "sdk-v$v" ] || { echo "::error::tag $GITHUB_REF_NAME is not sdk-v$v (sdk/pyproject.toml's version): bump the version, or tag sdk-v$v"; exit 1; }
          fi
          echo "### metis-loop-sdk $v ($GITHUB_REF_TYPE $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the sdist and the wheel from sdk/
        # from outside the source tree: a build/ directory there would shadow the `build` module;
        # the sdist copies the widget's files (metis_loop_sdk/widget links ../../web/catalog)
        run: |
          python -m pip install -q build
          python -m build --outdir dist metis-loop/sdk
          ls -l dist
      - name: Smoke-install the wheel in a fresh venv, outside the checkout
        run: bash metis-loop/sdk/tools/smoke_wheel.sh dist $([ -d metis-catalog ] && echo metis-catalog)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/metis-loop-sdk/
    permissions:
      id-token: write          # trusted publishing: the OIDC token is the credential
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
