name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      # metis-loop imports metispy and its tests read metis-catalog —
      # both public siblings, checked out beside it.
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-lang (public; test fixtures e.g. corpus/packmark.llp)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          path: metis-lang
      - name: Checkout metis-catalog (public; console + fixtures)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metis-loop/pyproject.toml
      - name: Install (console extra; the agent extra deliberately NOT)
        run: |
          pip install -e ./metispy
          pip install -e ./metis-catalog     # the CATALOG panel's loader (metis_catalog: the manifests)
          pip install -e './metis-loop[console]' pytest
      - name: Suite (incl. the real-socket gateway tests; agent tests skip without the SDK)
        working-directory: metis-loop
        run: pytest -q tests/
