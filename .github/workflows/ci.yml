name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      # metis-loop imports metispy and its tests read metis-catalog — both
      # public, checked out beside it and installed (-e): the tests find the
      # catalog as the installed metis_catalog's, never by the layout.
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-lang (public; test fixtures e.g. corpus/packmark.llp)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          path: metis-lang
      - name: Checkout metis-catalog (public; console + fixtures)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metis-loop/pyproject.toml
      - uses: actions/setup-node@v4     # the SDK's TypeScript face (sdk/tests/test_ts_face.py)
        with:
          node-version: '22.23.3'
      - name: Install OCaml + build metisc (the SDK's edit checks a program's diagnostics with it)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: Install (console extra; the agent extra deliberately NOT)
        run: |
          pip install -e ./metispy
          pip install -e ./metis-catalog     # the CATALOG panel's loader (metis_catalog: the manifests)
          pip install -e ./metis-loop/sdk       # the loop SDK (metis_loop_sdk), as the human loop consumes it
          pip install -e './metis-loop[console]' pytest
      # nav's and wildfire's hosts step the IPPC gym (metis-catalog tools/rddl_gym.py) in an
      # interpreter of their own: pyRDDLGym and rddlrepository, public on PyPI (MIT), pinned
      # as the packages' .venv has them; ~15 s and 181 MB with no pip cache
      - name: The gym for the RDDL packages' hosts (its own venv, METIS_RDDL_PY)
        run: |
          python -m venv /tmp/gym
          /tmp/gym/bin/pip install -q pyRDDLGym==2.7 rddlrepository==2.2
          echo "METIS_RDDL_PY=/tmp/gym/bin/python" >> "$GITHUB_ENV"
      - name: Suite (incl. the real-socket gateway tests; agent tests skip without the SDK)
        working-directory: metis-loop
        # metisc named (the SDK looks on PATH, never beside a checkout: cwd-root s-ddac2cbf)
        env: {METIS_LOOP_REQUIRE_NODE: '1', METIS_LOOP_REQUIRE_METISC: '1', METIS_LOOP_REQUIRE_GYM: '1',
              METISC: '${{ github.workspace }}/metis-lang/src/metisc'}
        run: pytest -q tests/ sdk/tests/

  # The SDK alone (brief/repo-alignment.md §2): a fresh venv with metispy,
  # metis-catalog and metis-loop-sdk and nothing of the human loop — the
  # direction rule (the SDK never imports loop/, metis_agent or the agentic
  # loop) proved by installation, not only by the test's AST walk.
  sdk-alone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4     # the SDK's TypeScript face (sdk/tests/test_ts_face.py)
        with:
          node-version: '22.23.3'
      - name: Install the SDK alone (non-editable, as a consumer gets it)
        run: |
          python -m venv /tmp/sdk
          /tmp/sdk/bin/pip install ./metispy ./metis-catalog
          /tmp/sdk/bin/pip install './metis-loop/sdk[test,claude]'   # [claude]: the command face's option tests run too
      - name: No human loop in the venv
        run: '! /tmp/sdk/bin/python -c "import loop"'
      - name: The wheel carries the CATALOG widget, byte for byte web/catalog/ (files, not a link), and the TypeScript face
        run: |
          /tmp/sdk/bin/python - "$GITHUB_WORKSPACE/metis-loop/web/catalog" <<'EOF'
          import sys
          from pathlib import Path
          from metis_loop_sdk import catalog
          web = Path(sys.argv[1])
          assert "site-packages" in str(catalog.WIDGET_DIR), catalog.WIDGET_DIR
          for f in catalog.WIDGET_FILES:
              got = catalog.WIDGET_DIR / f
              assert got.is_file() and not got.is_symlink(), got
              assert got.read_bytes() == (web / f).read_bytes(), f
              print("widget", f, "=", web / f, len(got.read_bytes()), "bytes")
          for f in catalog.TS_FILES:              # the TypeScript face, its own files
              got = catalog.TS_DIR / f
              assert "site-packages" in str(got) and got.is_file(), got
              print("ts", f, len(got.read_bytes()), "bytes")
          EOF
      - name: The wheel publish.yml uploads, smoke-installed in a fresh venv (metispy from PyPI, metis-catalog the checkout)
        run: |
          python -m pip install -q build
          python -m build --outdir /tmp/sdk-dist metis-loop/sdk
          bash metis-loop/sdk/tools/smoke_wheel.sh /tmp/sdk-dist metis-catalog
      - name: SDK suite (from outside the checkout, so the installed package is what runs)
        working-directory: /tmp
        # the fixtures: the metis-catalog checkout, named (the root is the cwd, cwd-root
        # s-ddac2cbf; the wheel's catalog lacks domains/ceptre/, which the suite reads)
        env: {METIS_LOOP_REQUIRE_NODE: '1', METIS_CATALOG: '${{ github.workspace }}/metis-catalog'}
        run: /tmp/sdk/bin/python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/metis-loop/sdk/tests"

  # ── pi/: the agentic loop (was the repo metis-agentic-loop; merged 2026-10-22) ──
  # The extensions against stand-ins (no model, no GPU): test/extensions.test.ts.
  # The stand-in metis forwards --tools-json to the real metispy; the domain
  # tools read the catalog through the python the domain agent would use.
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      # the domain agent (public): the domain tools' sessions over the selected packages run it —
      # example/seeded.ts on love_triangle and on nav, love_triangle's and nav's domain tools,
      # wildfire's episodes; they skipped without it
      - name: Checkout metis-agent (public; the domain agent the domain tools run)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-agent
          path: metis-agent
      - name: Checkout metis-lang (public; metisc checks a catalog_edit of a program)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          path: metis-lang
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
          echo "METISC=$GITHUB_WORKSPACE/metis-lang/src/metisc" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Install metispy, metis-catalog and the loop SDK (this checkout's sdk/, one tag with the extensions)"
        run: |
          pip install ./metispy ./metis-catalog ./metis-loop/sdk
          python -m metis_loop_sdk.web ts | python -c "import json,sys,os; d=json.load(sys.stdin)['dir']; assert os.path.isfile(os.path.join(d,'catalog.ts')), d"
          python -c "import metis_loop_sdk.models.openai, metis_loop_sdk.web, metis.catalog, metis.gate; print('sdk', metis_loop_sdk.__version__)"
      # nav's and wildfire's hosts step the IPPC gym in an interpreter of their own: pyRDDLGym and
      # rddlrepository, public on PyPI (MIT), pinned as the packages' .venv has them; ~15 s
      - name: The gym for the RDDL packages' hosts (its own venv, METIS_RDDL_PY)
        run: |
          python -m venv /tmp/gym
          /tmp/gym/bin/pip install -q pyRDDLGym==2.7 rddlrepository==2.2
          echo "METIS_RDDL_PY=/tmp/gym/bin/python" >> "$GITHUB_ENV"
      - name: 'Node and pi, pinned (setup.sh: checksummed node, npm ci from the lock)'
        working-directory: metis-loop/pi
        run: ./setup.sh
      - name: Shell syntax
        working-directory: metis-loop/pi
        run: bash -n setup.sh pi.sh loop.sh take.sh demo.sh example/lamp/world.sh
      - name: node tests
        working-directory: metis-loop/pi
        run: |
          export REAL_METIS="$(command -v metis)" TEST_AGENT_PY="$(command -v python)" TEST_SDK_PY="$(command -v python)" TEST_REQUIRE_METISC=1
          export TEST_REQUIRE_AGENT=1 TEST_REQUIRE_GYM=1
          # the fixtures' catalog (love_triangle, nav): the checkout, named (the installed wheel has no ceptre/)
          export TEST_CATALOG="$GITHUB_WORKSPACE/metis-catalog"
          ./node/bin/node --experimental-strip-types --test test/extensions.test.ts
