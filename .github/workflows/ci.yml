name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      # metis-loop imports metispy and its tests read metis-catalog —
      # both public siblings, checked out beside it.
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-lang (public; test fixtures e.g. corpus/packmark.llp)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          path: metis-lang
      - name: Checkout metis-catalog (public; console + fixtures)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metis-loop/pyproject.toml
      - uses: actions/setup-node@v4     # the SDK's TypeScript face (sdk/tests/test_ts_face.py)
        with:
          node-version: '22.23.3'
      - name: Install OCaml + build metisc (the SDK's edit checks a program's diagnostics with it)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: Install (console extra; the agent extra deliberately NOT)
        run: |
          pip install -e ./metispy
          pip install -e ./metis-catalog     # the CATALOG panel's loader (metis_catalog: the manifests)
          pip install -e ./metis-loop/sdk       # the loop SDK (metis_loop_sdk), as the human loop consumes it
          pip install -e './metis-loop[console]' pytest
      - name: Suite (incl. the real-socket gateway tests; agent tests skip without the SDK)
        working-directory: metis-loop
        env: {METIS_LOOP_REQUIRE_NODE: '1', METIS_LOOP_REQUIRE_METISC: '1'}
        run: pytest -q tests/ sdk/tests/

  # The SDK alone (brief/repo-alignment.md §2): a fresh venv with metispy,
  # metis-catalog and metis-loop-sdk and nothing of the human loop — the
  # direction rule (the SDK never imports loop/, metis_agent or the agentic
  # loop) proved by installation, not only by the test's AST walk.
  sdk-alone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-loop
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4     # the SDK's TypeScript face (sdk/tests/test_ts_face.py)
        with:
          node-version: '22.23.3'
      - name: Install the SDK alone (non-editable, as a consumer gets it)
        run: |
          python -m venv /tmp/sdk
          /tmp/sdk/bin/pip install ./metispy ./metis-catalog
          /tmp/sdk/bin/pip install './metis-loop/sdk[test,claude]'   # [claude]: the command face's option tests run too
      - name: No human loop in the venv
        run: '! /tmp/sdk/bin/python -c "import loop"'
      - name: The wheel carries the CATALOG widget, byte for byte web/catalog/ (files, not a link), and the TypeScript face
        run: |
          /tmp/sdk/bin/python - "$GITHUB_WORKSPACE/metis-loop/web/catalog" <<'EOF'
          import sys
          from pathlib import Path
          from metis_loop_sdk import catalog
          web = Path(sys.argv[1])
          assert "site-packages" in str(catalog.WIDGET_DIR), catalog.WIDGET_DIR
          for f in catalog.WIDGET_FILES:
              got = catalog.WIDGET_DIR / f
              assert got.is_file() and not got.is_symlink(), got
              assert got.read_bytes() == (web / f).read_bytes(), f
              print("widget", f, "=", web / f, len(got.read_bytes()), "bytes")
          for f in catalog.TS_FILES:              # the TypeScript face, its own files
              got = catalog.TS_DIR / f
              assert "site-packages" in str(got) and got.is_file(), got
              print("ts", f, len(got.read_bytes()), "bytes")
          EOF
      - name: SDK suite (from outside the checkout, so the installed package is what runs)
        working-directory: /tmp
        env: {METIS_LOOP_REQUIRE_NODE: '1'}
        run: /tmp/sdk/bin/python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/metis-loop/sdk/tests"
