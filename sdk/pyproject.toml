# metis-loop-sdk (loop-sdk s-9aabd5a0; brief/repo-alignment.md): the code
# that has to stay the same in every consumer — catalog access (+ the
# catalog widget the consoles share) and the model adapters. Its own
# distribution, so consumers (metis-agent, metis-agentic-loop) do not
# install the human loop's console. It imports metis_catalog and metispy
# and nothing else of ours; the human loop (../loop) imports it as any
# outside consumer would.
#
#   consumers:   pip install "metis-loop-sdk @ git+https://github.com/metis-lang-dev/metis-loop@sdk-vX.Y.Z#subdirectory=sdk"
#                (after metispy, on PyPI, and metis-catalog, its checkout or git URL: not on PyPI yet)
#   development: pip install -e sdk/   (in a metis-loop checkout; metispy and
#                metis-catalog installed first satisfy the names here)
# Released from GitHub by trusted publishing on a tag sdk-vX.Y.Z = this
# version (.github/workflows/publish.yml; pi-release s-8e13f6a8).
[build-system]
requires = ["setuptools>=77"]      # PEP 639: license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "metis-loop-sdk"
version = "0.1.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "The metis loop SDK: catalog access, the catalog widget and the model adapters, shared by metis-loop, metis-agent and metis-agentic-loop"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "metispy>=0.1.2"]   # 0.1.2: metis.catalog, metis.intents, metis.gate (metis-packages: this SDK re-exports them)

[project.optional-dependencies]
# the claude adapter's seat on the Agent SDK (the command face needs only the `claude` CLI)
claude = ["claude-agent-sdk"]
test = ["pytest", "metis-catalog>=0.1.1"]   # the tests read the installed metis-catalog's domains

[tool.setuptools.packages.find]
include = ["metis_loop_sdk*"]

[tool.setuptools.package-data]
# the catalog widget's JS/CSS (catalog-sdk s-bc1718e3): metis_loop_sdk/widget is
# a link to the checkout's web/catalog/ (web/: the shared web widgets); the wheel
# setuptools builds from the checkout (pip install ./sdk, the git URL's
# #subdirectory=sdk, or python -m build: its sdist copies the files the link
# points at) holds the files themselves; tools/smoke_wheel.sh checks them.
metis_loop_sdk = ["widget/*", "ts/*"]   # ts/: the TypeScript face (catalog.ts, gate.ts), files of its own

[tool.pytest.ini_options]
testpaths = ["tests"]
